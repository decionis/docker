# Build and verify the Decionis Docker Desktop extension on every change:
# UI gates (typecheck, drift-gate tests, production build) and the extension
# image build. `docker extension validate` needs the Desktop extension CLI,
# which runners don't ship — it runs locally per docs/marketplace/extension.md
# before any submission. Actions pinned to commit SHAs per
# rules/security.rules.md Rule 1.5 (SHA sweep 2026-08-18).
name: extension-image

on:
  pull_request:
    paths:
      - "extension/**"
      - "cmd/**"
      - "internal/**"
      - "go.mod"
      - ".github/workflows/extension-image.yml"
  push:
    branches: [master]
    paths:
      - "extension/**"
      - "cmd/**"
      - "internal/**"
      - "go.mod"
      - ".github/workflows/extension-image.yml"

permissions:
  contents: read

jobs:
  ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extension/ui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: extension/ui/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: hadolint
        uses: hadolint/hadolint-action@2a66e89f53d0771bb131a7fa31f3136336094aa6 # v3.4.0
        with:
          dockerfile: extension/Dockerfile
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Build extension image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: extension/Dockerfile
          load: true
          push: false
          tags: decionis/desktop-extension:ci
      - name: Vulnerability scan (release gate)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: decionis/desktop-extension:ci
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH
          ignore-unfixed: true
