# Unified CI, release, automation, and validation pipeline.
# Actions are pinned to audited commit SHAs (rules/security.rules.md Rule 1.5).
name: Actions

run-name: >-
  Actions / ${{ github.event_name }}${{
    github.ref_name && format(' / {0}', github.ref_name) || ''
  }}

on:
  push:
    branches: [master]
    tags:
      - "authority-v*"
      - "cli-v*"
      - "ext-v*"
      - "feature-govern-v*"
      - "mcp-v*"
  pull_request:
  create:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
    inputs:
      operation:
        description: Work to perform
        type: choice
        default: validate
        options:
          - validate
          - open-pull-request
          - push-hub-overview
      branch:
        description: Optional same-repository branch for the pull request bot
        required: false
        type: string
      creation_run_id:
        description: Optional create-event run proving branch ownership
        required: false
        type: string
      hub_repository:
        description: Docker Hub overview to publish
        type: choice
        default: desktop-extension
        options:
          - desktop-extension
          - mcp
          - authority
          - all

permissions:
  contents: read

concurrency:
  group: actions-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  patch_bootstrap:
    name: Patch bootstrap
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      release_kind: ${{ steps.release.outputs.kind }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - name: Check out the trusted workflow source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: >-
            ${{ (github.event_name == 'create' || github.event_name == 'schedule') &&
            github.event.repository.default_branch || github.ref }}
          persist-credentials: false
      - name: Classify release
        id: release
        shell: bash
        run: |
          set -euo pipefail
          kind="none"
          version=""
          case "${GITHUB_REF_NAME}" in
            ext-v*)             kind="extension"; version="${GITHUB_REF_NAME#ext-v}" ;;
            mcp-v*)             kind="mcp";       version="${GITHUB_REF_NAME#mcp-v}" ;;
            authority-v*)       kind="image";     version="${GITHUB_REF_NAME#authority-v}" ;;
            cli-v*)             kind="cli";       version="${GITHUB_REF_NAME#cli-v}" ;;
            feature-govern-v*)  kind="feature";   version="${GITHUB_REF_NAME#feature-govern-v}" ;;
          esac
          echo "kind=${kind}" >> "${GITHUB_OUTPUT}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "release kind: ${kind}; version: ${version:-n/a}"
      - name: Create repository-scoped GitHub App token
        id: app-token
        if: >-
          vars.PR_BOT_ENABLED == 'true' &&
          ((github.event_name == 'create' && github.event.ref_type == 'branch' && github.actor == 'ocularminds') ||
          github.event_name == 'schedule' ||
          (github.event_name == 'workflow_dispatch' && inputs.operation == 'open-pull-request'))
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.PR_BOT_CLIENT_ID }}
          private-key: ${{ secrets.PR_BOT_PRIVATE_KEY }}
          permission-actions: read
          permission-contents: read
          permission-pull-requests: write
      - name: Set up Node.js for pull request automation
        if: steps.app-token.outcome == 'success'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.20.0
      - name: Open qualifying pull requests
        if: steps.app-token.outcome == 'success'
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          EXPECTED_AUTHOR_LOGIN: ocularminds
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        run: node scripts/OpenPullRequest.mjs

  build_test:
    name: Build & Test / ${{ matrix.component }}
    if: >-
      github.event_name == 'pull_request' ||
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch'
    needs: patch_bootstrap
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        component: [go, extension, mcp, image]
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        if: matrix.component == 'go'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Check Go formatting
        if: matrix.component == 'go'
        shell: bash
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "${unformatted}" ]; then
            echo "gofmt required for:" >&2
            echo "${unformatted}" >&2
            exit 1
          fi
      - name: Vet Go packages
        if: matrix.component == 'go'
        run: go vet ./...
      - name: Test Go packages
        if: matrix.component == 'go'
        run: go test -coverprofile=coverage.out -covermode=atomic ./...
      - name: Upload coverage
        if: matrix.component == 'go'
        continue-on-error: true
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: coverage.out
          use_oidc: true

      - name: Set up Node.js
        if: matrix.component == 'extension'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: extension/ui/package-lock.json
      - name: Install extension dependencies
        if: matrix.component == 'extension'
        working-directory: extension/ui
        run: npm ci --ignore-scripts
      - name: Typecheck extension UI
        if: matrix.component == 'extension'
        working-directory: extension/ui
        run: npm run typecheck
      - name: Test extension UI
        if: matrix.component == 'extension'
        working-directory: extension/ui
        run: npm run test
      - name: Build extension UI
        if: matrix.component == 'extension'
        working-directory: extension/ui
        run: npm run build

      - name: Lint extension Dockerfile
        if: matrix.component == 'extension'
        uses: hadolint/hadolint-action@2a66e89f53d0771bb131a7fa31f3136336094aa6 # v3.4.0
        with:
          dockerfile: extension/Dockerfile
      - name: Lint MCP Dockerfile
        if: matrix.component == 'mcp'
        uses: hadolint/hadolint-action@2a66e89f53d0771bb131a7fa31f3136336094aa6 # v3.4.0
        with:
          dockerfile: mcp-server/Dockerfile
      - name: Lint authority Dockerfile
        if: matrix.component == 'image'
        uses: hadolint/hadolint-action@2a66e89f53d0771bb131a7fa31f3136336094aa6 # v3.4.0
        with:
          dockerfile: cmd/authority-proxy/Dockerfile
      - name: Set up Docker Buildx
        if: matrix.component != 'go'
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Build extension image
        if: matrix.component == 'extension'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: extension/Dockerfile
          load: true
          push: false
          tags: decionis/desktop-extension:ci
      - name: Build MCP image
        if: matrix.component == 'mcp'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: mcp-server
          load: true
          push: false
          tags: decionis/mcp:ci
      - name: Build authority image
        if: matrix.component == 'image'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: cmd/authority-proxy/Dockerfile
          load: true
          push: false
          tags: decionis/authority:ci
      - name: Smoke test MCP image
        if: matrix.component == 'mcp'
        run: bash mcp-server/test/smoke.sh decionis/mcp:ci
      - name: Smoke test authority fail-closed behavior
        if: matrix.component == 'image'
        shell: bash
        run: |
          set -euo pipefail
          trap 'docker rm -f authority-smoke >/dev/null 2>&1 || true' EXIT
          docker run -d --name authority-smoke -p 127.0.0.1:18080:8080 \
            -e DECIONIS_ORG_ID=11111111-1111-4111-8111-111111111111 \
            -e DECIONIS_API_KEY=smoke-not-a-real-key \
            -e DECIONIS_BASE_URL=https://127.0.0.1:9 \
            decionis/authority:ci
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18080/healthz >/dev/null 2>&1; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:18080/healthz >/dev/null
          status="$(curl -s -o /tmp/gate.json -w '%{http_code}' -X POST \
            http://127.0.0.1:18080/v1/gate -H 'content-type: application/json' \
            -d '{"decision_type":"refund"}')"
          test "${status}" = "403"
          grep -q '"allowed":false' /tmp/gate.json
          body="$(curl -s -X POST http://127.0.0.1:18080/v1/mcp/before-tool-call \
            -H 'content-type: application/json' \
            -d '{"params":{"name":"smoke_tool","arguments":{}}}')"
          test -n "${body}"
          echo "${body}" | grep -q '"isError":true'
      - name: Scan extension image
        if: matrix.component == 'extension'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: decionis/desktop-extension:ci
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH
          ignore-unfixed: true
      - name: Scan MCP image
        if: matrix.component == 'mcp'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: decionis/mcp:ci
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH
          ignore-unfixed: true
      - name: Scan authority image
        if: matrix.component == 'image'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: decionis/authority:ci
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH
          ignore-unfixed: true

  publish_extension:
    name: Publish extension
    if: needs.patch_bootstrap.outputs.release_kind == 'extension'
    needs: [patch_bootstrap, build_test]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    outputs:
      published: ${{ steps.creds.outputs.present }}
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Detect Docker Hub credentials
        id: creds
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        shell: bash
        run: |
          if [ -n "${DOCKERHUB_USERNAME}" ] && [ -n "${DOCKERHUB_TOKEN}" ]; then
            echo "present=true" >> "${GITHUB_OUTPUT}"
          else
            echo "present=false" >> "${GITHUB_OUTPUT}"
            echo "Docker Hub credentials are not configured; skipping publication."
          fi
      - name: Log in to Docker Hub
        if: steps.creds.outputs.present == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Publish extension image with provenance and SBOM
        if: steps.creds.outputs.present == 'true'
        id: push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: extension/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            decionis/desktop-extension:${{ needs.patch_bootstrap.outputs.version }}
            decionis/desktop-extension:latest
          provenance: mode=max
          sbom: true
          build-args: IMAGE_VERSION=${{ needs.patch_bootstrap.outputs.version }}
      - name: Install cosign
        if: steps.creds.outputs.present == 'true'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign extension image
        if: steps.creds.outputs.present == 'true'
        run: cosign sign --yes docker.io/decionis/desktop-extension@${{ steps.push.outputs.digest }}

  publish_mcp:
    name: Publish MCP
    if: needs.patch_bootstrap.outputs.release_kind == 'mcp'
    needs: [patch_bootstrap, build_test]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    outputs:
      published: ${{ steps.creds.outputs.present }}
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Detect Docker Hub credentials
        id: creds
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        shell: bash
        run: |
          if [ -n "${DOCKERHUB_USERNAME}" ] && [ -n "${DOCKERHUB_TOKEN}" ]; then
            echo "present=true" >> "${GITHUB_OUTPUT}"
          else
            echo "present=false" >> "${GITHUB_OUTPUT}"
            echo "Docker Hub credentials are not configured; skipping publication."
          fi
      - name: Log in to Docker Hub
        if: steps.creds.outputs.present == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Publish MCP image with provenance and SBOM
        if: steps.creds.outputs.present == 'true'
        id: push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: mcp-server
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            decionis/mcp:${{ needs.patch_bootstrap.outputs.version }}
            decionis/mcp:latest
          provenance: mode=max
          sbom: true
          build-args: IMAGE_VERSION=${{ needs.patch_bootstrap.outputs.version }}
      - name: Install cosign
        if: steps.creds.outputs.present == 'true'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign MCP image
        if: steps.creds.outputs.present == 'true'
        run: cosign sign --yes docker.io/decionis/mcp@${{ steps.push.outputs.digest }}

  publish_image:
    name: Publish image
    if: >-
      needs.patch_bootstrap.outputs.release_kind == 'image' ||
      needs.patch_bootstrap.outputs.release_kind == 'cli' ||
      needs.patch_bootstrap.outputs.release_kind == 'feature' ||
      (github.event_name == 'workflow_dispatch' && inputs.operation == 'push-hub-overview')
    needs: [patch_bootstrap, build_test]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
      packages: write
    outputs:
      published: ${{ steps.creds.outputs.present }}
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Detect Docker Hub credentials
        if: >-
          needs.patch_bootstrap.outputs.release_kind == 'image' ||
          (github.event_name == 'workflow_dispatch' && inputs.operation == 'push-hub-overview')
        id: creds
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        shell: bash
        run: |
          if [ -n "${DOCKERHUB_USERNAME}" ] && [ -n "${DOCKERHUB_TOKEN}" ]; then
            echo "present=true" >> "${GITHUB_OUTPUT}"
          else
            echo "present=false" >> "${GITHUB_OUTPUT}"
            echo "Docker Hub credentials are not configured; skipping publication."
          fi
      - name: Set up QEMU
        if: needs.patch_bootstrap.outputs.release_kind == 'image'
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - name: Set up Docker Buildx
        if: needs.patch_bootstrap.outputs.release_kind == 'image'
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Log in to Docker Hub
        if: needs.patch_bootstrap.outputs.release_kind == 'image' && steps.creds.outputs.present == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Publish authority image with provenance and SBOM
        if: needs.patch_bootstrap.outputs.release_kind == 'image' && steps.creds.outputs.present == 'true'
        id: push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: cmd/authority-proxy/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            decionis/authority:${{ needs.patch_bootstrap.outputs.version }}
            decionis/authority:latest
          provenance: mode=max
          sbom: true
          build-args: IMAGE_VERSION=${{ needs.patch_bootstrap.outputs.version }}
      - name: Install cosign
        if: needs.patch_bootstrap.outputs.release_kind == 'image' && steps.creds.outputs.present == 'true'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign authority image
        if: needs.patch_bootstrap.outputs.release_kind == 'image' && steps.creds.outputs.present == 'true'
        run: cosign sign --yes docker.io/decionis/authority@${{ steps.push.outputs.digest }}

      - name: Set up Go for CLI release
        if: needs.patch_bootstrap.outputs.release_kind == 'cli'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Build CLI release binaries
        if: needs.patch_bootstrap.outputs.release_kind == 'cli'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          for platform in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            GOOS="${platform%/*}" GOARCH="${platform#*/}" CGO_ENABLED=0 \
              go build -trimpath \
                -ldflags "-s -w -X github.com/decionis/docker/internal/version.Version=${{ needs.patch_bootstrap.outputs.version }}" \
                -o dist/decionis ./cmd/decionis
            tar -czf "dist/decionis_${platform%/*}_${platform#*/}.tar.gz" -C dist decionis
            rm dist/decionis
          done
          (cd dist && sha256sum ./*.tar.gz > SHA256SUMS)
      - name: Create CLI GitHub release
        if: needs.patch_bootstrap.outputs.release_kind == 'cli'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --title "decionis CLI ${{ needs.patch_bootstrap.outputs.version }}" \
            --notes "decionis CLI ${{ needs.patch_bootstrap.outputs.version }}: govern · verify · status · hooks. Assets are consumed by the ghcr.io/decionis/features/govern Dev Container Feature with mandatory SHA-256 verification."

      - name: Set up Node.js for feature release
        if: needs.patch_bootstrap.outputs.release_kind == 'feature'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Assert tag matches the feature version
        if: needs.patch_bootstrap.outputs.release_kind == 'feature'
        run: |
          feature_version="$(node -p "require('./features/govern/devcontainer-feature.json').version")"
          test "${feature_version}" = "${{ needs.patch_bootstrap.outputs.version }}"
      - name: Log in to GitHub Container Registry
        if: needs.patch_bootstrap.outputs.release_kind == 'feature'
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Publish Dev Container Feature
        if: needs.patch_bootstrap.outputs.release_kind == 'feature'
        run: npx -y @devcontainers/cli@0.88.0 features publish ./features --registry ghcr.io --namespace decionis/features

      - name: Push Docker Hub overview
        if: >-
          github.event_name == 'workflow_dispatch' &&
          inputs.operation == 'push-hub-overview' &&
          steps.creds.outputs.present == 'true'
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          TARGET: ${{ inputs.hub_repository }}
        shell: bash
        run: |
          set -euo pipefail
          jwt="$(python3 - <<'PY'
          import json, os, urllib.request
          request = urllib.request.Request(
              "https://hub.docker.com/v2/users/login",
              data=json.dumps({
                  "username": os.environ["DOCKERHUB_USERNAME"],
                  "password": os.environ["DOCKERHUB_TOKEN"],
              }).encode(),
              headers={"Content-Type": "application/json"},
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              print(json.load(response)["token"])
          PY
          )"
          echo "::add-mask::${jwt}"
          push_one() {
            hub_repo="$1"
            source_file="$2"
            HUB_REPO="${hub_repo}" SOURCE_FILE="${source_file}" JWT="${jwt}" python3 - <<'PY'
          import json, os, sys, urllib.request
          source = os.environ["SOURCE_FILE"]
          with open(source, encoding="utf-8") as handle:
              body = handle.read()
          if len(body) > 25000:
              sys.exit(f"{source} is {len(body)} chars; Hub caps full_description at 25000")
          request = urllib.request.Request(
              f"https://hub.docker.com/v2/repositories/decionis/{os.environ['HUB_REPO']}/",
              data=json.dumps({"full_description": body}).encode(),
              headers={
                  "Content-Type": "application/json",
                  "Authorization": "JWT " + os.environ["JWT"],
              },
              method="PATCH",
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              payload = json.load(response)
          stored = len(payload.get("full_description") or "")
          if stored != len(body):
              sys.exit(f"Hub stored {stored} chars for {os.environ['HUB_REPO']}, expected {len(body)}")
          print(f"pushed {source} -> decionis/{os.environ['HUB_REPO']} ({stored} chars)")
          PY
          }
          case "${TARGET}" in
            desktop-extension) push_one desktop-extension extension/overview.md ;;
            mcp)               push_one mcp mcp-server/overview.md ;;
            authority)         push_one authority cmd/authority-proxy/overview.md ;;
            all)
              push_one desktop-extension extension/overview.md
              push_one mcp mcp-server/overview.md
              push_one authority cmd/authority-proxy/overview.md
              ;;
            *) echo "unknown target ${TARGET}" >&2; exit 1 ;;
          esac

  validations:
    name: Validations / ${{ matrix.component }}
    if: >-
      always() &&
      needs.build_test.result == 'success' &&
      (needs.publish_extension.result == 'success' || needs.publish_extension.result == 'skipped') &&
      (needs.publish_mcp.result == 'success' || needs.publish_mcp.result == 'skipped') &&
      (needs.publish_image.result == 'success' || needs.publish_image.result == 'skipped')
    needs: [patch_bootstrap, build_test, publish_extension, publish_mcp, publish_image]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        component: [workflow, extension, mcp, image]
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go for actionlint
        if: matrix.component == 'workflow'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Validate Actions syntax and semantics
        if: matrix.component == 'workflow'
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 .github/workflows/actions.yml
      - name: Test pull request automation
        if: matrix.component == 'workflow'
        run: node --test test/automation/*.test.mjs
      - name: Validate Dev Container Feature metadata
        if: matrix.component == 'workflow'
        shell: bash
        run: |
          jq -e '.id == "govern" and (.version | test("^[0-9]+\\.[0-9]+\\.[0-9]+$"))' \
            features/govern/devcontainer-feature.json >/dev/null
          sh -n features/govern/install.sh
      - name: Validate extension metadata and Compose model
        if: matrix.component == 'extension'
        shell: bash
        run: |
          jq -e '.icon and .vm.composefile and .ui["dashboard-tab"].src' extension/metadata.json >/dev/null
          DESKTOP_PLUGIN_IMAGE=decionis/desktop-extension:ci \
            docker compose -f extension/compose.yaml config --quiet
      - name: Inspect published extension manifest
        if: matrix.component == 'extension' && needs.publish_extension.outputs.published == 'true'
        run: docker buildx imagetools inspect docker.io/decionis/desktop-extension:${{ needs.patch_bootstrap.outputs.version }}
      - name: Validate MCP package lock and smoke harness
        if: matrix.component == 'mcp'
        shell: bash
        run: |
          npm ci --ignore-scripts --prefix mcp-server
          bash -n mcp-server/test/smoke.sh
      - name: Inspect published MCP manifest
        if: matrix.component == 'mcp' && needs.publish_mcp.outputs.published == 'true'
        run: docker buildx imagetools inspect docker.io/decionis/mcp:${{ needs.patch_bootstrap.outputs.version }}
      - name: Validate authority and release artifacts
        if: matrix.component == 'image'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          case "${{ needs.patch_bootstrap.outputs.release_kind }}" in
            image)
              if [ "${{ needs.publish_image.outputs.published }}" = "true" ]; then
                docker buildx imagetools inspect docker.io/decionis/authority:${{ needs.patch_bootstrap.outputs.version }}
              fi
              ;;
            cli) gh release view "${GITHUB_REF_NAME}" --json tagName,assets >/dev/null ;;
            feature) docker buildx imagetools inspect ghcr.io/decionis/features/govern:${{ needs.patch_bootstrap.outputs.version }} ;;
            *) test -s cmd/authority-proxy/Dockerfile ;;
          esac
