# Publish the Docker Desktop extension image on tags `ext-vX.Y.Z` to
# decionis/desktop-extension (image-first ordering, rules/discovery.rules.md
# Rule 4.1; version tags are immutable, Rule 3.3).
#
# Env-gated per Rule 3.2: verification always runs; without Docker Hub
# credentials the publish steps no-op silently. Release artifacts carry
# provenance + SBOM attestations and a keyless cosign signature
# (rules/security.rules.md Rule 1.5); the vulnerability scan is the blocking
# release gate (Rule 1.6). `docker extension validate` needs the Desktop CLI
# and runs locally per docs/marketplace/extension.md.
# Actions pinned to commit SHAs per Rule 1.5 (SHA sweep 2026-08-18).
name: extension-publish

on:
  push:
    tags: ["ext-v*"]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # cosign keyless signing via GitHub OIDC
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Derive version from tag
        id: ver
        run: echo "version=${GITHUB_REF_NAME#ext-v}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Build for verification
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: extension/Dockerfile
          load: true
          push: false
          tags: decionis/desktop-extension:release-check
          build-args: |
            IMAGE_VERSION=${{ steps.ver.outputs.version }}
      - name: Vulnerability scan (blocking release gate)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: decionis/desktop-extension:release-check
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH
          ignore-unfixed: true
      - name: Detect publish credentials
        id: creds
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -n "$DOCKERHUB_USERNAME" ] && [ -n "$DOCKERHUB_TOKEN" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "Docker Hub credentials not configured; skipping publish (silent no-op, discovery rule 3.2)."
          fi
      - name: Log in to Docker Hub
        if: steps.creds.outputs.present == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Push multi-platform image with provenance + SBOM
        if: steps.creds.outputs.present == 'true'
        id: push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: extension/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            decionis/desktop-extension:${{ steps.ver.outputs.version }}
            decionis/desktop-extension:latest
          provenance: mode=max
          sbom: true
          build-args: |
            IMAGE_VERSION=${{ steps.ver.outputs.version }}
      - name: Install cosign
        if: steps.creds.outputs.present == 'true'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign image (keyless)
        if: steps.creds.outputs.present == 'true'
        run: cosign sign --yes docker.io/decionis/desktop-extension@${{ steps.push.outputs.digest }}
