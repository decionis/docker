# Pushes the committed Docker Hub overviews to Hub (discovery rule 2.1: the
# overview is committed in-repo and pushed by CI — never edited only in the
# Hub UI). Dispatch-only; publishing is the run's purpose, so failures fail
# the run visibly. Env-gated: without the Hub secrets the job explains and
# exits successfully (rule 3.2), so forks stay green.
name: hub-overview
on:
  workflow_dispatch:
    inputs:
      repo:
        description: Which Hub repository's overview to push
        type: choice
        default: desktop-extension
        options:
          - desktop-extension
          - mcp
          - authority
          - all

permissions:
  contents: read

jobs:
  push-overview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Push overview(s) from the committed sources
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          TARGET: ${{ inputs.repo }}
        run: |
          set -euo pipefail
          if [ -z "${DOCKERHUB_USERNAME}" ] || [ -z "${DOCKERHUB_TOKEN}" ]; then
            echo "Hub credentials are not configured; nothing to push." >&2
            exit 0
          fi
          jwt="$(python3 - <<'PY'
          import json, os, urllib.request
          request = urllib.request.Request(
              "https://hub.docker.com/v2/users/login",
              data=json.dumps({
                  "username": os.environ["DOCKERHUB_USERNAME"],
                  "password": os.environ["DOCKERHUB_TOKEN"],
              }).encode(),
              headers={"Content-Type": "application/json"},
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              print(json.load(response)["token"])
          PY
          )"
          echo "::add-mask::${jwt}"
          push_one() {
            hub_repo="$1"; source_file="$2"
            HUB_REPO="$hub_repo" SOURCE_FILE="$source_file" JWT="$jwt" python3 - <<'PY'
          import json, os, sys, urllib.request
          source = os.environ["SOURCE_FILE"]
          with open(source, encoding="utf-8") as handle:
              body = handle.read()
          if len(body) > 25000:
              sys.exit(f"{source} is {len(body)} chars; Hub caps full_description at 25000")
          request = urllib.request.Request(
              f"https://hub.docker.com/v2/repositories/decionis/{os.environ['HUB_REPO']}/",
              data=json.dumps({"full_description": body}).encode(),
              headers={
                  "Content-Type": "application/json",
                  "Authorization": "JWT " + os.environ["JWT"],
              },
              method="PATCH",
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              payload = json.load(response)
          got = len(payload.get("full_description") or "")
          if got != len(body):
              sys.exit(f"Hub stored {got} chars for {os.environ['HUB_REPO']}, expected {len(body)}")
          print(f"pushed {source} -> decionis/{os.environ['HUB_REPO']} ({got} chars)")
          PY
          }
          case "${TARGET}" in
            desktop-extension) push_one desktop-extension extension/overview.md ;;
            mcp)               push_one mcp mcp-server/overview.md ;;
            authority)         push_one authority cmd/authority-proxy/overview.md ;;
            all)
              push_one desktop-extension extension/overview.md
              push_one mcp mcp-server/overview.md
              push_one authority cmd/authority-proxy/overview.md
              ;;
            *) echo "unknown target ${TARGET}" >&2; exit 1 ;;
          esac
