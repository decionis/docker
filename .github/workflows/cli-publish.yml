# Release the decionis CLI on tags `cli-vX.Y.Z`: run the full Go gates, build
# linux/darwin × amd64/arm64 binaries with the version stamped, and publish a
# GitHub release with SHA-256 checksums — the artifacts the Dev Container
# Feature's install.sh downloads and verifies. Version tags are immutable
# (rules/discovery.rules.md Rule 3.3).
# Actions pinned to commit SHAs per rules/security.rules.md Rule 1.5
# (SHA sweep 2026-08-18).
name: cli-publish

on:
  push:
    tags: ["cli-v*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # gh release create
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Gates
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
          go test ./...
      - name: Build release binaries
        run: |
          VERSION="${GITHUB_REF_NAME#cli-v}"
          mkdir -p dist
          for platform in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            GOOS="${platform%/*}" GOARCH="${platform#*/}" CGO_ENABLED=0 \
              go build -trimpath \
                -ldflags "-s -w -X github.com/decionis/docker/internal/version.Version=${VERSION}" \
                -o dist/decionis ./cmd/decionis
            tar -czf "dist/decionis_${platform%/*}_${platform#*/}.tar.gz" -C dist decionis
            rm dist/decionis
          done
          (cd dist && sha256sum ./*.tar.gz > SHA256SUMS)
          ls -la dist/
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "decionis CLI ${GITHUB_REF_NAME#cli-v}" \
            --notes "decionis CLI ${GITHUB_REF_NAME#cli-v}: govern · verify · status · hooks. Assets are consumed by the ghcr.io/decionis/features/govern Dev Container Feature with mandatory SHA-256 verification."
